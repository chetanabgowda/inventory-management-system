<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="msapplication-TileColor" content="#1a1a2e">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Inventory Management System - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #e0e0e0;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(173, 216, 230, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(240, 248, 255, 0.1) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, -10px) rotate(1deg); }
            50% { transform: translate(10px, 10px) rotate(-1deg); }
            75% { transform: translate(-5px, 5px) rotate(0.5deg); }
        }

        /* Glitter Particles */
        .glitter {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 3s linear infinite;
        }

        .glitter:nth-child(odd) {
            animation-duration: 2.5s;
            animation-delay: -1s;
        }

        .glitter:nth-child(3n) {
            animation-duration: 4s;
            animation-delay: -2s;
        }

        @keyframes sparkle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Login Container */
        .login-container {
            position: relative;
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(22, 33, 62, 0.8));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: containerFloat 6s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Logo/Title */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            background: linear-gradient(135deg, #4CAF50, #2196F3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: none;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 2px 10px rgba(76, 175, 80, 0.3)); }
            100% { filter: drop-shadow(0 2px 20px rgba(33, 150, 243, 0.5)); }
        }

        .login-header p {
            color: #b0b0b0;
            font-size: 1.1em;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 25px;
            position: relative;
            animation: slideInLeft 0.8s ease-out both;
        }

        .form-group:nth-child(1) { animation-delay: 0.8s; }
        .form-group:nth-child(2) { animation-delay: 1s; }
        .form-group:nth-child(3) { animation-delay: 1.2s; }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-50px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            border-color: #4CAF50;
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.2), inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .form-group input:focus + .input-icon {
            color: #4CAF50;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Additional Links */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            animation: fadeInUp 1s ease-out 1.6s both;
        }

        .login-footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .login-footer a:hover {
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        /* QR Code Section */
        .qr-section {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease-out 1.8s both;
        }

        .qr-section h3 {
            color: #e0e0e0;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 8px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: qrPulse 2s ease-in-out infinite;
        }

        @keyframes qrPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Floating Elements */
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s linear infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 20%;
            right: 10%;
            animation-delay: -5s;
        }

        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: -10s;
        }

        .shape:nth-child(4) {
            width: 40px;
            height: 40px;
            bottom: 10%;
            right: 20%;
            animation-delay: -15s;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                margin: 50px 20px;
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 2em;
            }

            .qr-code {
                width: 100px;
                height: 100px;
            }
        }

        /* Loading Animation */
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <!-- Floating Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Glitter Particles -->
    <div class="glitter" style="left: 10%; animation-delay: 0s;"></div>
    <div class="glitter" style="left: 20%; animation-delay: 0.5s;"></div>
    <div class="glitter" style="left: 30%; animation-delay: 1s;"></div>
    <div class="glitter" style="left: 40%; animation-delay: 1.5s;"></div>
    <div class="glitter" style="left: 50%; animation-delay: 2s;"></div>
    <div class="glitter" style="left: 60%; animation-delay: 2.5s;"></div>
    <div class="glitter" style="left: 70%; animation-delay: 3s;"></div>
    <div class="glitter" style="left: 80%; animation-delay: 3.5s;"></div>
    <div class="glitter" style="left: 90%; animation-delay: 4s;"></div>

    <div class="login-container">
        <div class="login-header">
            <h1>Inventory Pro</h1>
            <p>Manage your inventory with style</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
                <i class="input-icon">👤</i>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
                <i class="input-icon">🔒</i>
            </div>

            <button type="submit" class="login-btn">
                <span class="btn-text">Login to Dashboard</span>
                <div class="loading"></div>
            </button>
        </form>

        <div class="login-footer">
            <a href="#" onclick="showForgotPassword()">Forgot Password?</a> |
            <a href="#" onclick="showRegister()">Create Account</a>
        </div>

        <!-- QR Code Section -->
        <div class="qr-section">
            <h3>Scan for Website Info</h3>
            <div class="qr-code">
                <img id="qrImage" src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=Inventory%20Management%20System%20-%20Web%20app%20for%20inventory%20tracking." alt="QR Code for Website Information" style="border-radius: 8px; background: white;">
            </div>
            <p style="color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 10px;">
                Scan to access website information
            </p>
        </div>
    </div>

    <script>
        // Create more glitter particles dynamically
        function createGlitter() {
            const glitter = document.createElement('div');
            glitter.className = 'glitter';
            glitter.style.left = Math.random() * 100 + '%';
            glitter.style.animationDelay = Math.random() * 3 + 's';
            glitter.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(glitter);

            setTimeout(() => {
                if (glitter.parentNode) {
                    glitter.parentNode.removeChild(glitter);
                }
            }, 5000);
        }

        // Create glitter particles every 300ms
        setInterval(createGlitter, 300);

        // Form handling
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.querySelector('.login-btn');
            const btnText = btn.querySelector('.btn-text');
            const loading = btn.querySelector('.loading');

            // Show loading state
            btnText.style.display = 'none';
            loading.style.display = 'block';
            btn.disabled = true;

            // Simulate login process
            setTimeout(() => {
                // Hide loading
                btnText.style.display = 'inline';
                loading.style.display = 'none';
                btn.disabled = false;

                // Show success message
                showMessage('Login successful! Redirecting...', 'success');

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            }, 2000);
        });

        // Input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Message display function
        function showMessage(message, type) {
            // Remove existing message
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }

            // Create message element
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            messageEl.textContent = message;

            // Style the message
            messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 600;
                z-index: 1000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                backdrop-filter: blur(10px);
            `;

            if (type === 'success') {
                messageEl.style.backgroundColor = 'rgba(76, 175, 80, 0.9)';
                messageEl.style.color = 'white';
            } else {
                messageEl.style.backgroundColor = 'rgba(244, 67, 54, 0.9)';
                messageEl.style.color = 'white';
            }

            // Add slide-in animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
            `;
            document.head.appendChild(style);

            // Add to page
            document.body.appendChild(messageEl);

            // Auto-remove after 3 seconds
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.remove();
                }
            }, 3000);
        }

        // Placeholder functions for links
        function showForgotPassword() {
            showMessage('Password reset feature coming soon!', 'info');
        }

        function showRegister() {
            showMessage('Registration feature coming soon!', 'info');
        }

        // Add some interactive effects
        document.addEventListener('mousemove', function(e) {
            const shapes = document.querySelectorAll('.shape');
            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 0.5;
                const x = (window.innerWidth - e.pageX * speed) / 100;
                const y = (window.innerHeight - e.pageY * speed) / 100;
                shape.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
